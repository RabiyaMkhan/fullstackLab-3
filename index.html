<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="todo-app">

    <h1>My To-Do List</h1>

    <!-- Task 1: Input box and Add button -->
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button id="addBtn">Add</button>
    </div>

    <!-- Task 5: Error message for empty input -->
    <p class="error-message" id="errorMessage"></p>

    <!-- Task 1: New tasks will be displayed here -->
    <ul id="taskList"></ul>
    
    <!-- Task 6: Clear completed tasks -->
    <button id="clearBtn">Clear Completed</button>

    <!-- Task 4: Task counter and empty-state message -->
    <p class="task-count" id="taskCount">0 tasks</p>

  </div>

  <script src="script.js"></script>

</body>
</html>
